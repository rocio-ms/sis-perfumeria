<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Fondo con degradado suave azul-blanco -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Degradado azul para el icono principal -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Sombra suave para dar relieve -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Fondo Cuadrado (600x600 px) -->
  <rect width="600" height="600" fill="url(#bgGradient)" />

  <!-- Marco borde punteado en azul tenue -->
  <rect x="30" y="30" width="540" height="540" rx="20" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- TARJETA CENTRAL EN BLANCO Y AZUL -->
  <g filter="url(#softShadow)">
    <!-- Círculo base blanco -->
    <circle cx="300" cy="250" r="95" fill="#FFFFFF"/>
    
    <!-- Círculo interior azul suave -->
    <circle cx="300" cy="250" r="80" fill="#EFF6FF"/>

    <!-- ICONO DE CÁMARA / IMAGEN (Azul y Blanco sin tachado) -->
    <g transform="translate(245, 195)">
      <!-- Marco de la fotografía -->
      <rect x="10" y="15" width="90" height="70" rx="12" fill="none" stroke="url(#blueGradient)" stroke-width="6"/>
      
      <!-- Paisaje / Montañas -->
      <path d="M 20,70 L 42,42 L 56,58 L 72,36 L 90,70 Z" fill="url(#blueGradient)"/>
      
      <!-- Sol -->
      <circle cx="36" cy="36" r="7" fill="url(#blueGradient)"/>
    </g>
  </g>

  <!-- TEXTO EN AZUL -->
  <text x="300" y="410" 
        text-anchor="middle"
        font-family="'Inter', 'Segoe UI', 'Roboto', sans-serif" 
        font-size="28" 
        font-weight="700" 
        fill="#1E3A8A" 
        letter-spacing="0.5">
    SIN IMAGEN DISPONIBLE
  </text>
</svg>
