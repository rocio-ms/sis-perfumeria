services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sys-perfumeria-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    networks:
      - sys-perfumeria

  nginx:
    image: nginx:alpine
    container_name: sys-perfumeria-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sys-perfumeria

  mysql:
    image: mysql:8.0
    container_name: sys-perfumeria-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sys_perfumeria
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: perfumeria
      MYSQL_PASSWORD: perfumeria
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sys-perfumeria

  node:
    image: node:22-alpine
    container_name: sys-perfumeria-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "corepack enable && corepack prepare pnpm@11.14.0 --activate && pnpm install && pnpm run build"
    networks:
      - sys-perfumeria

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sys-perfumeria-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: perfumeria
      PMA_PASSWORD: perfumeria
    depends_on:
      - mysql
    networks:
      - sys-perfumeria
networks:
  sys-perfumeria:

volumes:
  mysql_data: